
name: Build WiFi Finder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Add Android
        run: npx cap add android

      - name: Copy Native Plugin
        run: |
          mkdir -p android/app/src/main/java/com/talkhestan/wififinder
          cp native/android/java/com/talkhestan/wififinder/*.java \
          android/app/src/main/java/com/talkhestan/wififinder/

      - name: Add Permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = [
              "ACCESS_WIFI_STATE",
              "CHANGE_WIFI_STATE",
              "ACCESS_FINE_LOCATION"
          ]

          additions = ""

          for permission in permissions:
              full = f"android.permission.{permission}"
              if full not in s:
                  additions += f'    <uses-permission android:name="{full}"/>\n'

          if additions:
              s = s.replace("<application", additions + "<application", 1)

          p.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Finder-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
