
name: Build WiFi Finder APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Dependencies
        run: npm install

      - name: Prepare Web Files
        run: |
          mkdir -p www/src
          cp index.html www/index.html
          cp src/style.css www/src/style.css
          cp src/app.js www/src/app.js

      - name: Add Android Platform
        run: npx cap add android

      - name: Install Native WiFi Scanner
        run: |
          mkdir -p android/app/src/main/java/com/talkhestan/wififinder

          cp native/android/java/com/talkhestan/wififinder/*.java \
          android/app/src/main/java/com/talkhestan/wififinder/

      - name: Add Android Permissions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/src/main/AndroidManifest.xml")
          s = p.read_text()

          permissions = """
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE"/>
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION"/>
          """

          if "ACCESS_WIFI_STATE" not in s:
              s = s.replace("<application", permissions + "\n    <application", 1)

          p.write_text(s)
          PY

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WiFi-Finder-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
