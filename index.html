
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <title>WiFi Finder</title>
  <link rel="stylesheet" href="src/style.css">
</head>

<body>
  <main class="app">

    <header class="header">
      <div class="logo">◉</div>
      <div>
        <h1>WiFi Finder</h1>
        <p>شناسایی شبکه‌های بی‌سیم اطراف</p>
      </div>
    </header>

    <section class="scan-panel">
      <div class="radar">
        <div class="radar-circle">
          <span>WiFi</span>
        </div>
      </div>

      <h2>اسکن شبکه‌های اطراف</h2>
      <p class="muted">
        برای شناسایی شبکه‌های قابل مشاهده، دکمه زیر را لمس کنید.
      </p>

      <button id="scanBtn" class="scan-button">
        <span>⌕</span>
        شروع اسکن
      </button>

      <div id="status" class="status">
        آماده اسکن
      </div>
    </section>

    <section class="results-section">

      <div class="section-title">
        <h2>شبکه‌های شناسایی‌شده</h2>
        <span id="count">۰ شبکه</span>
      </div>

      <div class="summary">
        <div>
          <strong id="totalCount">۰</strong>
          <small>تعداد شبکه‌ها</small>
        </div>
        <div>
          <strong id="strongCount">۰</strong>
          <small>سیگنال قوی</small>
        </div>
      </div>

      <div id="networkList">
        <div class="empty">
          <div class="empty-icon">⌁</div>
          هنوز شبکه‌ای اسکن نشده است.
        </div>
      </div>

    </section>

    <footer>
      WiFi Finder | نسخه 1.0.0
    </footer>

  </main>

  <script type="module" src="src/app.js"></script>
</body>
</html>
